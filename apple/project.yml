name: CndIPTV
options:
  bundleIdPrefix: com.cnd.iptv
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
    tvOS: "17.0"
  generateEmptyDirectories: true

packages:
  CndCoreBridge:
    path: Packages/CndCoreBridge

settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    PRODUCT_NAME: CndIPTV
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM:}
    CODE_SIGN_STYLE: Automatic

targets:
  CndIPTV-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/CndIptvApp
      - path: Sources/CndIptvKit
    dependencies:
      - package: CndCoreBridge
        product: CndCoreBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cnd.iptv.macos
        INFOPLIST_FILE: Resources/Info-macOS.plist
        CODE_SIGN_ENTITLEMENTS: Resources/CndIPTV-macOS.entitlements
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"

  CndIPTV-iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/CndIptvApp
      - path: Sources/CndIptvKit
    dependencies:
      - package: CndCoreBridge
        product: CndCoreBridge
      - target: CndIPTV-LiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.papacoundia.cndiptv
        INFOPLIST_FILE: Resources/Info-iOS.plist
        TARGETED_DEVICE_FAMILY: "1,2"

  CndIPTV-tvOS:
    type: application
    platform: tvOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/CndIptvApp
      - path: Sources/CndIptvKit
    dependencies:
      - package: CndCoreBridge
        product: CndCoreBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cnd.iptv.tvos
        INFOPLIST_FILE: Resources/Info-tvOS.plist
        CODE_SIGN_ENTITLEMENTS: Resources/CndIPTV-tvOS.entitlements
        CODE_SIGN_IDENTITY: "-"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES

  # Apple Vision Pro: the iPad interface in windows (PRD 22, lot 22.2).
  CndIPTV-visionOS:
    type: application
    platform: visionOS
    deploymentTarget: "1.0"
    sources:
      - path: Sources/CndIptvApp
      - path: Sources/CndIptvKit
    dependencies:
      - package: CndCoreBridge
        product: CndCoreBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.papacoundia.cndiptv.vision
        INFOPLIST_FILE: Resources/Info-visionOS.plist
        TARGETED_DEVICE_FAMILY: "7"
        SUPPORTED_PLATFORMS: "xros xrsimulator"
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: YES

  # Lock screen and Dynamic Island for recordings and "now playing" (PRD 22, lot 22.1).
  CndIPTV-LiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: LiveActivityExtension
      - path: Sources/CndIptvKit/Features/LiveActivities/LiveActivityAttributes.swift
      - path: Sources/CndIptvKit/Features/LiveActivities/LiveActivityIntents.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.papacoundia.cndiptv.liveactivity
        INFOPLIST_FILE: LiveActivityExtension/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        PRODUCT_NAME: CndLiveActivity
