[workspace]
resolver = "2"
members = [
    "crates/cnd-domain",
    "crates/cnd-domain-wasm",
    "crates/cnd-core",
    "crates/cnd-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["CND Labs"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.33", features = ["bundled", "blob", "functions"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.11"
url = "2.5"
blake3 = "1.5"
quick-xml = { version = "0.37", features = ["serialize", "async-tokio"] }
async-compression = { version = "0.4", features = ["tokio", "gzip"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io"] }

[profile.android-release]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
strip = true


