# https://taskfile.dev  —  `task` lists the tasks, `task <name>` runs one.
version: "3"

vars:
  APPLE_DIR: apple
  BRIDGE_DIR: apple/Packages/CndCoreBridge
  # Keeps xcodebuild output out of the tracked apple/.build folders.
  DERIVED_DATA: build/DerivedData

tasks:
  default:
    silent: true
    cmds:
      - task --list

  # ---------------------------------------------------------------- keys
  keys:
    desc: Regenerate the default API keys from .env / the environment (PRD 28); needed once before swift build or test
    cmds:
      - ./scripts/gen-default-keys.sh

  keys:test:
    desc: Tests of the default API keys generator
    cmds:
      - ./scripts/test-gen-default-keys.sh

  lint:ui:
    desc: Report fixed sizes written in views instead of the design tokens (PRD 30; STRICT=1 to fail)
    cmds:
      - ./scripts/lint-ui.sh {{if .STRICT}}--strict{{end}}

  secrets:check:
    desc: Fails if .env is tracked or a known API key shape is in a versioned file
    cmds:
      - ./scripts/check-secrets.sh

  # ---------------------------------------------------------------- run
  run:
    desc: Build (debug) and launch the app on macOS
    aliases: [dev, start]
    cmds:
      - ./scripts/run-macos.sh

  run:macos:
    desc: Build (debug) and launch the app on macOS
    aliases: [macos:run]
    cmds:
      - ./scripts/run-macos.sh {{if .RELEASE}}--release{{end}} {{if .REBUILD_CORE}}--rebuild-core{{end}} {{if .FOREGROUND}}--foreground{{end}}

  run:macos:release:
    desc: Build (release) and launch the app on macOS
    aliases: [macos:run:release]
    cmds:
      - ./scripts/run-macos.sh --release

  run:release:
    desc: Build (release) and launch the app on macOS
    cmds:
      - ./scripts/run-macos.sh --release

  run:fresh:
    desc: Rebuild the Rust core XCFramework, then build and launch
    cmds:
      - ./scripts/run-macos.sh --rebuild-core

  run:logs:
    desc: Run the app in this terminal so its logs are visible
    cmds:
      - ./scripts/run-macos.sh --foreground

  run:iphone:
    desc: Build, install and launch the app on a connected iPhone/iPad (DEVICE="name or UDID" to pick one)
    cmds:
      - ./scripts/run-iphone.sh {{if .DEVICE}}--device "{{.DEVICE}}"{{end}}

  install:iphone:
    desc: Build and install the app on a connected iPhone without launching it (DEVICE="name or UDID" to pick one)
    cmds:
      - ./scripts/run-iphone.sh --no-launch {{if .DEVICE}}--device "{{.DEVICE}}"{{end}}

  run:iphone:release:
    desc: Same as run:iphone with an optimized build
    cmds:
      - ./scripts/run-iphone.sh --release {{if .DEVICE}}--device "{{.DEVICE}}"{{end}}

  iphone:devices:
    desc: List the connected iPhones/iPads
    cmds:
      - ./scripts/run-iphone.sh --list

  run:android:
    desc: Build, install and launch Buntu on a connected Android phone/tablet/TV/emulator (DEVICE="serial or model" to pick one)
    aliases: [android:run]
    cmds:
      - ./scripts/run-android.sh {{if .DEVICE}}--device "{{.DEVICE}}"{{end}} {{if .REBUILD_CORE}}--rebuild-core{{end}}

  install:android:
    desc: Build and install Buntu on a connected Android device without launching it (DEVICE="serial or model" to pick one)
    aliases: [android:install]
    cmds:
      - ./scripts/run-android.sh --no-launch {{if .DEVICE}}--device "{{.DEVICE}}"{{end}}

  run:android:release:
    desc: Same as run:android with an optimized R8 release build
    aliases: [android:run:release]
    cmds:
      - ./scripts/run-android.sh --release {{if .DEVICE}}--device "{{.DEVICE}}"{{end}}

  run:android:tv:
    desc: Build, install and launch Buntu in Leanback 10-foot TV mode on an Android TV / Google TV device (DEVICE="serial or IP")
    aliases: [android:tv]
    cmds:
      - ./scripts/run-android.sh --tv {{if .DEVICE}}--device "{{.DEVICE}}"{{end}}

  run:web:
    desc: Run the Samsung TV app (Buntu, Tizen) in the browser with hot reload (PORT=5173); no AVPlay video, no Samsung channel
    aliases: [web, tizen:web]
    dir: tizen
    cmds:
      - '[ -d node_modules ] || npm install'
      - npx vite --host --port {{.PORT | default "5173"}} --open

  # ---------------------------------------------------------------- tizen
  tizen:build:
    desc: Build WebAssembly domain and package the Samsung Smart TV app (.wgt)
    aliases: [tizen:package]
    cmds:
      - ./scripts/build-tizen.sh

  tizen:test:
    desc: Run unit tests for the Tizen Smart TV app (Vitest)
    cmds:
      - cd tizen && npm test

  tizen:install:
    desc: Build, sign, install and launch .wgt package on a Samsung TV in Developer Mode (TV_IP="192.168.x.x")
    aliases: [tizen:run, run:tizen, install:tizen]
    cmds:
      - ./scripts/run-tizen.sh {{if .TV_IP}}--ip "{{.TV_IP}}"{{end}} {{if .NO_BUILD}}--no-build{{end}} {{if .NO_LAUNCH}}--no-launch{{end}}

  tizen:debug:
    desc: Launch remote web inspector (Chrome DevTools) for debugging on Samsung TV
    cmds:
      - |
        export PATH="$PATH:$HOME/tizen-studio/tools:$HOME/tizen-studio/tools/ide/bin"
        sdb dpm --on
        sdb forward tcp:9222 tcp:9222
        echo "Open chrome://inspect or http://localhost:9222 in Chrome to debug"

  run:android:logs:
    desc: Build, install, launch and stream Buntu logcat from a connected Android device
    aliases: [android:logs]
    cmds:
      - ./scripts/run-android.sh --logs {{if .DEVICE}}--device "{{.DEVICE}}"{{end}}

  android:devices:
    desc: List connected Android phones, tablets, TVs and emulators
    cmds:
      - ./scripts/run-android.sh --list

  bundle:
    desc: Assemble build/CndIPTV.app without launching it
    cmds:
      - ./scripts/run-macos.sh --build-only

  install:
    desc: Build (release) and install Buntu into /Applications on this Mac
    aliases: [app:install]
    cmds:
      - ./scripts/install-macos.sh

  install:user:
    desc: Build (release) and install Buntu into ~/Applications (user-only)
    cmds:
      - ./scripts/install-macos.sh --user

  cli:
    desc: "Run the Rust CLI, e.g. task cli -- download <url> [dir]"
    cmds:
      - cargo run --quiet -p cnd-cli -- {{.CLI_ARGS}}

  # --------------------------------------------------------------- core
  core:build:
    desc: Compile the Rust workspace
    cmds:
      - cargo build --workspace

  core:test:
    desc: Rust unit tests (use `task core:test:release` for the SLA benchmark)
    cmds:
      - cargo test --workspace

  core:test:release:
    desc: Rust tests in release mode (includes the 50k-item ingestion SLA)
    cmds:
      - cargo test --workspace --release

  core:lint:
    desc: Clippy with warnings as errors
    cmds:
      - cargo clippy --workspace --all-targets -- -D warnings

  core:fmt:
    desc: Format the Rust code
    cmds:
      - cargo fmt --all

  xcframework:
    desc: Rebuild the universal XCFramework + UniFFI Swift bindings (run after any cnd-core API change)
    aliases: [core:xcframework]
    sources:
      - crates/cnd-core/src/**/*.rs
      - crates/cnd-core/Cargo.toml
      - Cargo.toml
      - Cargo.lock
    generates:
      - "{{.BRIDGE_DIR}}/cnd_coreFFI.xcframework/Info.plist"
    cmds:
      - ./scripts/build-xcframework.sh

  # -------------------------------------------------------------- swift
  swift:build:
    desc: Build the Swift package (debug)
    dir: "{{.APPLE_DIR}}"
    cmds:
      - swift build

  swift:test:
    desc: App unit tests
    dir: "{{.APPLE_DIR}}"
    deps: [keys]
    cmds:
      - swift test

  swift:test:bridge:
    desc: FFI bridge tests
    dir: "{{.BRIDGE_DIR}}"
    cmds:
      - swift test

  xcode:generate:
    desc: Regenerate the Xcode project from apple/project.yml using XcodeGen
    dir: "{{.APPLE_DIR}}"
    deps: [keys]
    cmds:
      - xcodegen generate

  xcode:open:
    desc: Open the Xcode project (apple/CndIPTV.xcodeproj) in Xcode
    aliases: [open:xcode, xcode]
    cmds:
      - test -d apple/CndIPTV.xcodeproj || task xcode:generate
      - open apple/CndIPTV.xcodeproj

  xcode:macos:
    desc: xcodebuild for macOS (CONFIG=Release for a release build)
    dir: "{{.APPLE_DIR}}"
    vars:
      CONFIG: '{{default "Debug" .CONFIG}}'
    cmds:
      - >-
        xcodebuild -scheme CndIPTV-macOS -configuration {{.CONFIG}}
        -destination 'generic/platform=macOS'
        -derivedDataPath ../{{.DERIVED_DATA}} CODE_SIGNING_ALLOWED=NO -quiet build

  xcode:ios:
    desc: xcodebuild for the iOS Simulator (CONFIG=Release for a release build)
    dir: "{{.APPLE_DIR}}"
    vars:
      CONFIG: '{{default "Debug" .CONFIG}}'
    cmds:
      - >-
        xcodebuild -scheme CndIPTV-iOS -configuration {{.CONFIG}}
        -destination 'generic/platform=iOS Simulator'
        -derivedDataPath ../{{.DERIVED_DATA}} -quiet build

  xcode:visionos:
    desc: xcodebuild for the visionOS Simulator (needs the visionOS SDK; no simulator is needed to build)
    dir: "{{.APPLE_DIR}}"
    cmds:
      - >-
        xcodebuild -scheme CndIPTV-visionOS -configuration Debug
        -destination 'generic/platform=visionOS Simulator'
        -derivedDataPath ../{{.DERIVED_DATA}} CODE_SIGNING_ALLOWED=NO -quiet build

  # ------------------------------------------------------------- android (PRD 37)
  android:core:
    desc: Build Rust cnd-core for Android ABIs (arm64-v8a, armeabi-v7a, x86_64) + UniFFI Kotlin bindings
    cmds:
      - ./scripts/build-android.sh {{if .FORCE}}--force{{end}}

  android:build:
    desc: Build Android debug & release APKs (Phone + Android TV)
    deps: [android:core]
    dir: android
    cmds:
      - ./gradlew assembleDebug assembleRelease

  android:test:
    desc: Run all Android JVM unit, JNA FFI integration, and SRP module architecture tests
    deps: [android:core]
    dir: android
    cmds:
      - ./gradlew testDebugUnitTest :core:domain:test lintDebug

  android:bench:
    desc: Run Macrobenchmark startup & 60 fps scroll suite on a connected Android device
    deps: [android:core]
    dir: android
    cmds:
      - ./gradlew :benchmark:connectedBenchmarkAndroidTest

  # ------------------------------------------------------------ archives (PRD 23)
  # DEVELOPMENT_TEAM=<team id> signs the archive; without it the archive is built unsigned.
  app:macos:
    desc: Release archive of the macOS app in build/archives (DEVELOPMENT_TEAM=<id> to sign)
    dir: "{{.APPLE_DIR}}"
    cmds:
      - >-
        xcodebuild -project CndIPTV.xcodeproj -scheme CndIPTV-macOS -configuration Release
        -destination 'generic/platform=macOS' -archivePath ../build/archives/CndIPTV-macOS.xcarchive
        -derivedDataPath ../{{.DERIVED_DATA}}
        {{if .DEVELOPMENT_TEAM}}DEVELOPMENT_TEAM={{.DEVELOPMENT_TEAM}} -allowProvisioningUpdates{{else}}CODE_SIGNING_ALLOWED=NO{{end}}
        -quiet archive

  app:ios:
    desc: Release archive of the iPhone/iPad app in build/archives (DEVELOPMENT_TEAM=<id> to sign)
    dir: "{{.APPLE_DIR}}"
    cmds:
      - >-
        xcodebuild -project CndIPTV.xcodeproj -scheme CndIPTV-iOS -configuration Release
        -destination 'generic/platform=iOS' -archivePath ../build/archives/CndIPTV-iOS.xcarchive
        -derivedDataPath ../{{.DERIVED_DATA}}
        {{if .DEVELOPMENT_TEAM}}DEVELOPMENT_TEAM={{.DEVELOPMENT_TEAM}} -allowProvisioningUpdates{{else}}CODE_SIGNING_ALLOWED=NO{{end}}
        -quiet archive

  # ------------------------------------------------------------ groups
  test:
    desc: All fast tests (Rust, bridge, app)
    cmds:
      - task: core:test
      - task: swift:test:bridge
      - task: swift:test

  lint:
    desc: Static checks (Clippy)
    cmds:
      - task: core:lint

  check:
    desc: Full release-readiness validation (what the last PRD requires)
    cmds:
      - task: secrets:check
      - task: keys:test
      - task: core:lint
      - task: core:test:release
      - task: xcframework
      - task: swift:test:bridge
      - task: swift:test
      - task: xcode:macos
        vars: { CONFIG: Release }
      - task: xcode:ios
        vars: { CONFIG: Release }

  # ----------------------------------------------------------- upkeep
  doctor:
    desc: Check that the required tools are installed
    silent: true
    cmds:
      - |
        ok=1
        for tool in cargo rustc swift xcodebuild codesign; do
          if command -v "$tool" >/dev/null 2>&1; then printf '  ok       %s\n' "$tool"
          else printf '  MISSING  %s\n' "$tool"; ok=0; fi
        done
        for target in aarch64-apple-darwin x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios; do
          if rustup target list --installed 2>/dev/null | grep -qx "$target"; then printf '  ok       rust target %s\n' "$target"
          else printf '  MISSING  rust target %s  (rustup target add %s)\n' "$target" "$target"; ok=0; fi
        done
        if [ -e /opt/homebrew/lib/libmpv.2.dylib ] || [ -e /usr/local/lib/libmpv.2.dylib ]; then echo "  ok       libmpv (mpv engine available)"
        else echo "  optional libmpv not found: mkv/avi/ts cannot play, only AVPlayer formats (brew install mpv)"; fi
        [ "$ok" = 1 ] && echo "All required tools are present." || { echo "Some required tools are missing."; exit 1; }

  icon:
    desc: Regenerate assets/AppIcon.icns and assets/AppIcon-1024.png from the SwiftUI logo
    cmds:
      - rm -rf build/icon && mkdir -p build/icon assets apple/Resources/Assets.xcassets/AppIcon.appiconset
      - cd {{.APPLE_DIR}} && CND_EXPORT_ICON="$PWD/../build/icon/AppIcon.iconset" CND_EXPORT_IOS_ICON="$PWD/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png" swift test --filter AppLogoTests
      - iconutil -c icns build/icon/AppIcon.iconset -o assets/AppIcon.icns
      - cp apple/Resources/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png assets/AppIcon-1024.png

  clean:
    desc: Remove the build/ folder (app bundle, Swift scratch and DerivedData)
    prompt: This deletes ./build. Continue?
    cmds:
      - rm -rf build

  clean:core:
    desc: Remove the Rust target/ folder (the next build is a full rebuild)
    prompt: This deletes ./target and takes minutes to rebuild. Continue?
    cmds:
      - cargo clean
